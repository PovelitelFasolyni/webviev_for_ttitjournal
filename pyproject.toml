[project]
name = "ttit-journal"
version = "1.0.0"
description = "TTIT Journal WebView App"
requires-python = ">=3.12"
dependencies = [
    "flet",
    "flet-webview",
]

[tool.flet]
# Укажите имя вашего приложения
product = "TTIT Journal"
# Укажите ваш package name (можно изменить на свой)
org = "com.yourname.ttit"

[tool.flet.icons]
#Путь к директории с иконками
android = "assets/icon_android.png"

[tool.flet.icons]
android = "assets/icon_android.png"
hide_animation = true       # скрыть анимацию загрузки Flet по умолчанию


#[tool.flet.splash]
# color = "#ffffff"           # измените на цвет фона вашего приложения
# dark_color = "#222222"      # цвет фона для тёмной темы

